server:
  port: 8080

spring:
  application:
    name: tcc-api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://host.docker.internal:8003
          predicates:
            - Path=/api/auth/**

        - id: product-service
          uri: http://host.docker.internal:8001
          predicates:
            - Path=/api/products/**

        - id: order-service
          uri: http://host.docker.internal:8002
          predicates:
            - Path=/api/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer-uri: ${JWT_ISSUER_URI:}
    public-paths:
      - /actuator/health
      - /api/auth/**
      - /public/**