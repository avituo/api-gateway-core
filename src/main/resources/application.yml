server:
  port: 8080

spring:
  application:
    name: tcc-api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://host.docker.internal:8003
          predicates:
            - Path=/api/auth/**

        - id: product-service
          uri: http://host.docker.internal:8001
          predicates:
            - Path=/api/v1/products/**

        - id: order-service
          uri: http://host.docker.internal:8002
          predicates:
            - Path=/api/v1/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  gateway:
    key: ${GATEWAY_INTERNAL_KEY}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:http://auth-service:8003}
    audience: ${JWT_AUDIENCE:tcc-api-gateway}
    public-paths:
      - /actuator/health
      - /api/auth/**
      - /public/**
